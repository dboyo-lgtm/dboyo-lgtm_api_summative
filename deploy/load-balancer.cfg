# HAProxy config used on lb-01 (frontend and backend part)
# Location on the server: /etc/haproxy/haproxy.cfg
# (the "global" and "defaults" sections are the Ubuntu defaults)

frontend hapr-frontend
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/www.dboyo.tech.pem
    redirect scheme https if !{ ssl_fc }       # HTTP -> HTTPS
    default_backend hapr-backend

backend hapr-backend
    balance roundrobin                          # take turns between servers
    server 7256-web-01 18.130.26.196:80 check   # "check" = health check
    server 7256-web-02 18.130.206.5:80 check
