# Nginx config used on web-01 and web-02
# Location on the server: /etc/nginx/sites-available/daylight

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/daylight;
    index index.html;

    # Shows which server answered (used to test the load balancer)
    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ =404;
    }
}